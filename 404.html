<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Yusuf</title>
  <meta name="description" content="The page you're looking for doesn't exist or has been moved." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./css/style.css" />
  <meta name="theme-color" content="#0a0a2e" />
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(40px, 10vh, 120px) clamp(20px, 8vw, 120px);
      text-align: center;
      background: #0a0a2e;
      color: #e2e2dd;
    }
    .not-found h1 {
      font-family: "Roslindale Display Condensed", serif;
      font-size: clamp(72px, 18vw, 240px);
      line-height: 0.9;
      margin: 0;
      letter-spacing: -0.02em;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1px #e2e2dd;
    }
    .not-found p {
      font-size: clamp(16px, 1.6vw, 22px);
      max-width: 560px;
      margin: 2rem 0 0;
      opacity: 0.78;
    }
    .not-found a {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 0.85rem 1.75rem;
      border: 1px solid currentColor;
      text-decoration: none;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 12px;
      color: #e2e2dd;
      transition: opacity 0.18s ease-out;
    }
    .not-found a:hover { opacity: 0.7; }
  </style>
</head>
<body class="body" data-page="404">
  <main class="not-found" id="main" tabindex="-1">
    <h1>404</h1>
    <p>This page doesn't exist or has been moved.</p>
    <a href="./">Back to home</a>
  </main>
</body>
</html>
