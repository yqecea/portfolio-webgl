<!DOCTYPE html>
<html lang="en">

<head>

  <title>Cookie Policy</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .cookie-page {
      min-height: 100vh;
      padding: 10vh 8vw;
      background: #e5e3dc;
      color: #0a0a0a;
    }

    .cookie-page h1 {
      margin-bottom: 2rem;
      font-size: clamp(2rem, 4vw, 4rem);
    }

    .cookie-page p {
      max-width: 60ch;
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .cookie-back {
      display: inline-block;
      margin-top: 2rem;
      text-decoration: underline;
    }
  </style>
</head>

<body class="body" data-page="cookie">
  <main class="cookie-page">
    <h1>Cookie Policy</h1>
    <p>
      This portfolio stores basic browser data to keep audio playback state between page transitions.
    </p>
    <p>
      By browsing this site, you consent to the use of these cookies/local storage values for experience continuity.
    </p>
    <a class="cookie-back" href="../index.html">Back to Home</a>

</html>
